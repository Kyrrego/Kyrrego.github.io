short_bio: | 
  Hi! I am Yunrui Zhang, a third-year Electrical and Computer Engineering Ph.D. student at Cornell University advised by <a href="https://www.cocolaboratory.com/members">Prof. Amy Kuceyeski</a> and <a href="https://sabuncu.engineering.cornell.edu/">Prof. Mert Sabuncu</a>. I am currently a research intern at <a href="https://www.siemens-healthineers.com/en-us">Siemens Healthineers</a>, where I work on multimodal AI for medical imaging. <br>
  I received my Bachelor's degree from Tsinghua University, where I was very fortunate to be advised by Prof. Gangtie Zheng, Prof. Mingguo Zhao and Prof. Rebing Wu. <br>
  My research interests lie broadly at the intersection of AI/ML and healthcare, with a focus on functional magnetic resonance imaging (fMRI) 🧠, brain-behavior mapping, and surgical robotics 🦾. <br>
  During my leisure time, I enjoy classic Chinese literature & poetry 📜, fiction 📖, piano 🎹 and musicals 🎶. 

